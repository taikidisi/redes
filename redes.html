<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redes sociales</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap" rel="stylesheet">
<style>
:root{--c:#dc2743;--s:1}
html,body{margin:0;background:transparent;overflow:hidden;font-family:'Rubik',system-ui,sans-serif}
#pill{display:inline-grid;margin:16px;padding:10px 28px 10px 10px;border-radius:16px;background:rgba(13,15,28,.82);border:2px solid var(--c);transition:border-color .6s;transform:scale(var(--s));transform-origin:top left}
.item{grid-area:1/1;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.item.on{opacity:1;transform:none}
.item.out{transform:translateY(-14px)}
.ico{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:30px;height:30px}
.name{color:#fff;font-size:30px;font-weight:500;white-space:nowrap}
#hint{color:#fff;font-size:18px;margin:16px;max-width:560px;line-height:1.5}
@media (prefers-reduced-motion:reduce){.item,.item.out{transform:none}}
</style>
</head>
<body>
<div id="pill"></div>
<script>
/*
  Uso en OBS (fuente de navegador), ejemplo:
  https://TU_USUARIO.github.io/redes/?ig=usuario&tiktok=usuario&x=usuario&yt=usuario&time=4&size=1

  - ig, tiktok, x, yt: usuario de cada red (con o sin @, o el link completo).
    Si una red no está en la URL, no aparece.
  - time: segundos que se muestra cada red (por defecto 4).
  - size: tamano (1 = normal, 1.5 = mas grande).
*/
const q = new URLSearchParams(location.search);

function user(v) {
  v = (v || '').trim();
  if (!v) return '';
  try { v = decodeURIComponent(v); } catch (e) {}
  v = v.split('?')[0].split('#')[0].replace(/\/+$/, '');
  return v.split('/').pop().replace(/^@/, '');
}

const nets = [
  { id: 'ig', c: '#dc2743', bg: 'linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)',
    svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg>' },
  { id: 'tiktok', c: '#25f4ee', bg: '#000; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35)',
    svg: '<svg viewBox="0 0 24 24" fill="#fff" style="filter:drop-shadow(1.5px 1.5px 0 #fe2c55) drop-shadow(-1.5px -1.5px 0 #25f4ee)"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>' },
  { id: 'x', c: '#f2f2f2', bg: '#000; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35)',
    svg: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>' },
  { id: 'yt', c: '#ff0033', bg: '#ff0033',
    svg: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M9 6.5v11l9-5.5z"/></svg>' }
].map(n => ({ ...n, h: user(q.get(n.id)) })).filter(n => n.h);

const pill = document.getElementById('pill');
document.documentElement.style.setProperty('--s', parseFloat(q.get('size')) || 1);

nets.forEach(n => {
  const el = document.createElement('div');
  el.className = 'item';
  const ico = document.createElement('div');
  ico.className = 'ico';
  ico.setAttribute('style', 'background:' + n.bg);
  ico.innerHTML = n.svg;
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = '@' + n.h;
  el.append(ico, name);
  pill.appendChild(el);
  n.el = el;
});

let cur = -1;
function show(k) {
  const prev = cur;
  cur = k;
  nets.forEach((n, j) => {
    n.el.className = 'item' + (j === k ? ' on' : j === prev ? ' out' : '');
  });
  pill.style.setProperty('--c', nets[k].c);
}

if (nets.length) {
  show(0);
  if (nets.length > 1) {
    const t = (parseFloat(q.get('time')) || 4) * 1000;
    setInterval(() => show((cur + 1) % nets.length), t);
  }
} else {
  pill.style.display = 'none';
  if (!window.obsstudio) {
    const h = document.createElement('div');
    h.id = 'hint';
    h.style.color = '#888';
    h.textContent = 'Agrega los usuarios a la URL, por ejemplo: ?ig=usuario&tiktok=usuario&x=usuario&yt=usuario';
    document.body.appendChild(h);
  }
}
</script>
</body>
</html>
